<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif"><defs></defs><rect x="0" y="0" width="1180" height="520" fill="#ffffff"/><text x="40.0" y="44.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="start">A smart-key de dim_tempo</text><text x="40.0" y="66.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#64748b" text-anchor="start">Chave inteira YYYYMMDD: legível, ordenável e estável — dispensa JOIN para filtrar por período</text><rect x="300.0" y="130.0" width="160.0" height="96.0" rx="12" ry="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/><text x="380.0" y="193.4" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1d4ed8" text-anchor="middle">2025</text><text x="380.0" y="252.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">ano</text><rect x="470.0" y="130.0" width="100.0" height="96.0" rx="12" ry="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.2"/><text x="520.0" y="193.4" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="bold" fill="#15803d" text-anchor="middle">05</text><text x="520.0" y="252.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">mês</text><rect x="580.0" y="130.0" width="100.0" height="96.0" rx="12" ry="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/><text x="630.0" y="193.4" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="bold" fill="#ea580c" text-anchor="middle">30</text><text x="630.0" y="252.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ea580c" text-anchor="middle">dia</text><text x="300.0" y="114.0" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">sk_tempo  =</text><text x="710.0" y="186.0" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="22" font-weight="normal" fill="#1f2937" text-anchor="start">= 20250530</text><rect x="60.0" y="300.0" width="150.0" height="34.0" rx="9" ry="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="135.0" y="321.7" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#15803d" text-anchor="middle">Legível</text><text x="230.0" y="323.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">o valor é a própria data — facilita depurar SELECTs nos fatos</text><rect x="60.0" y="352.0" width="150.0" height="34.0" rx="9" ry="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="135.0" y="373.7" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#15803d" text-anchor="middle">Ordenável</text><text x="230.0" y="375.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">WHERE sk_tempo BETWEEN 20250101 AND 20251231 filtra o ano inteiro sem JOIN</text><rect x="60.0" y="404.0" width="150.0" height="34.0" rx="9" ry="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="135.0" y="425.7" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#15803d" text-anchor="middle">Estável</text><text x="230.0" y="427.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">não depende da ordem de carga (≠ SERIAL)</text><rect x="60.0" y="456.0" width="150.0" height="34.0" rx="9" ry="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="135.0" y="477.7" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#15803d" text-anchor="middle">Sentinela</text><text x="230.0" y="479.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">sk_tempo = 19000101 representa “data desconhecida/perdida”</text><rect x="40.0" y="280.0" width="1100.0" height="230.0" rx="10" ry="10" fill="none" stroke="#94a3b8" stroke-width="1"/><text x="60.0" y="280.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="1" font-weight="normal" fill="#1f2937" text-anchor="middle"></text></svg>