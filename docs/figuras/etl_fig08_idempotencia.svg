<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif"><defs></defs><rect x="0" y="0" width="1160" height="470" fill="#ffffff"/><text x="40.0" y="44.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="start">Três mecanismos de idempotência</text><text x="40.0" y="66.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#64748b" text-anchor="start">Re-executar qualquer etapa não duplica dados; o pipeline completo é reproduzível bit-a-bit</text><rect x="53.0" y="124.0" width="346.0" height="240.0" rx="12" ry="12" fill="#cbd5e1" stroke="none" stroke-width="1"/><rect x="50.0" y="120.0" width="346.0" height="240.0" rx="12" ry="12" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="223.0" y="161.6" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">Extract</text><rect x="72.0" y="178.0" width="302.0" height="38.0" rx="7" ry="7" fill="#0f172a" stroke="none" stroke-width="1"/><text x="223.0" y="201.4" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="bold" fill="#e2e8f0" text-anchor="middle">DELETE WHERE sk_fonte = N</text><text x="223.0" y="248.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Cada extract limpa apenas a fatia da sua</text><text x="223.0" y="268.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="middle">fonte antes de reinserir.</text><rect x="417.0" y="124.0" width="346.0" height="240.0" rx="12" ry="12" fill="#cbd5e1" stroke="none" stroke-width="1"/><rect x="414.0" y="120.0" width="346.0" height="240.0" rx="12" ry="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="587.0" y="161.6" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">Load de fatos</text><rect x="436.0" y="178.0" width="302.0" height="38.0" rx="7" ry="7" fill="#0f172a" stroke="none" stroke-width="1"/><text x="587.0" y="201.4" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="bold" fill="#e2e8f0" text-anchor="middle">TRUNCATE … RESTART IDENTITY</text><text x="587.0" y="248.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Zera o fato e reinicia as surrogate keys</text><text x="587.0" y="268.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="middle">antes de cada carga completa.</text><rect x="781.0" y="124.0" width="346.0" height="240.0" rx="12" ry="12" fill="#cbd5e1" stroke="none" stroke-width="1"/><rect x="778.0" y="120.0" width="346.0" height="240.0" rx="12" ry="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="951.0" y="161.6" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Load de dimensões</text><rect x="800.0" y="178.0" width="302.0" height="38.0" rx="7" ry="7" fill="#0f172a" stroke="none" stroke-width="1"/><text x="951.0" y="201.4" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="bold" fill="#e2e8f0" text-anchor="middle">ON CONFLICT DO UPDATE</text><text x="951.0" y="248.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="middle">UPSERT por chave natural: atualiza se</text><text x="951.0" y="268.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="middle">existe, insere se não — preserva</text><text x="951.0" y="288.0" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="middle">sentinelas.</text><rect x="50.0" y="378.0" width="1062.0" height="40.0" rx="9" ry="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="581.0" y="402.7" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#15803d" text-anchor="middle">re-execução completa do pipeline  →  resultado bit-a-bit idêntico</text></svg>